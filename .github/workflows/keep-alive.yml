name: Keep backend awake

on:
  schedule:
    # Offset from the start of the hour to reduce scheduler congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-keep-alive
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
    steps:
      - name: Check production health
        shell: bash
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 10 --max-time 75 \
            --retry 2 --retry-delay 5 --retry-max-time 150 \
            --output health.json "${DEPLOYMENT_URL%/}/api/health"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' health.json
          echo 'Production health check passed.'

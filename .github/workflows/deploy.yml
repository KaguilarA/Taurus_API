name: Backend CI and deployment

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm test

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
      DEPLOYMENT_METADATA_PATH: /api/deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Check deployment configuration
        run: test -n "$DEPLOYMENT_URL"
      - name: Package backend
        id: package
        run: node scripts/build-backend.mjs
      - name: Publish validated production branch
        env:
          ARTIFACT_DIR: ${{ steps.package.outputs.directory }}
        run: node scripts/publish-production.mjs
      - name: Verify deployed revision and database readiness
        run: node scripts/wait-deployment.mjs
